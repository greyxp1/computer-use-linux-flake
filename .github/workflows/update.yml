name: Update

on:
  workflow_dispatch:
  schedule:
    - cron: "37 * * * *"
    - cron: "59 8 * * 1"

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Check for release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REFRESH_INPUTS: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '59 8 * * 1' }}
        run: |
          set -euo pipefail
          current=$(perl -ne 'print "$1\n" if /version = "([^"]+)";/' flake.nix)
          tag=$(gh api repos/agent-sh/computer-use-linux/releases/latest --jq .tag_name)
          latest=${tag#v}
          [ -n "$current" ] && [ -n "$latest" ]
          {
            echo "latest=$latest"
            [ "$current" = "$latest" ] || echo "release_changed=true"
            if [ "$current" != "$latest" ] || [ "$REFRESH_INPUTS" = true ]; then
              echo "update_needed=true"
            else
              echo "update_needed=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Install Nix
        if: steps.check.outputs.update_needed == 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          determinate: false

      - name: Update package
        if: steps.check.outputs.release_changed == 'true'
        env:
          VERSION: ${{ steps.check.outputs.latest }}
        run: |
          set -euo pipefail
          url="https://github.com/agent-sh/computer-use-linux/releases/download/v$VERSION/computer-use-linux-x86_64-unknown-linux-gnu"
          hash=$(nix store prefetch-file --hash-type sha256 --json "$url" | jq -er .hash)
          HASH="$hash" perl -0pi -e '
            s/version = "[^"]+";/version = "$ENV{VERSION}";/;
            s/hash = "[^"]+";/hash = "$ENV{HASH}";/;
          ' flake.nix

      - name: Update inputs
        id: update
        if: steps.check.outputs.update_needed == 'true'
        run: |
          set -euo pipefail
          nix flake update --accept-flake-config
          if git diff --quiet -- flake.nix flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            nix flake check --no-build --no-update-lock-file --accept-flake-config
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        if: steps.update.outputs.changed == 'true'
        run: nix build .#computer-use-linux --no-link --no-update-lock-file --max-jobs 1 --cores 2

      - name: Commit update
        if: steps.update.outputs.changed == 'true'
        env:
          UPDATE_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flake.nix flake.lock
          git commit -m "updated computer use and nix inputs"
          git push origin "HEAD:$UPDATE_BRANCH"
